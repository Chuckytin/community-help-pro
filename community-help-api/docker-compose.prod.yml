services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always

  db:
    env_file:
      - .env.prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data-prod:/var/lib/postgresql
      - ./src/main/resources/db/init:/docker-entrypoint-initdb.d
    restart: always

volumes:
  postgres-data-prod: