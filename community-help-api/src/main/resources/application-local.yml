spring:
  config:
    import: optional:file:.env.dev[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/community_help_db?reWriteBatchedInserts=true
    username: root
    password: password
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  security:
    oauth2:
      client:
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=consent&access_type=offline

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: community-help-api
      environment: local

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    com.communityhelp.app: DEBUG

matching:
  run-on-startup: false

proposal:
  matching:
    max-active-proposals: 5
    proposal-cooldown-minutes: 15
    retry-delay-minutes: 2
    max-proposals-per-entity: 5
    max-radius-distance: 5000
    max-distance-score: 30
    max-weight-distance: 0.5
    max-weight-skills: 0.35
    max-weight-rating: 0.10
    max-weight-load: 0.05
    max-candidates-multiplier: 4
    radius-expansion-step: 5000
    max-expanded-radius: 30000
  retry-delay:
    interval-ms: 120000

notification:
  digest:
    interval-ms: 300000
  cleanup:
    retention-days: 7

jwt:
  secret: defaultLocalSecretKeyForCommunityHelp1234567890
  expiration-ms: 3600000
  expired-in: 3600000

app:
  admin:
    email: admin@local.com
    password: admin1234