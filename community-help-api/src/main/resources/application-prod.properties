# JPA - Validación estricta en producción
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 console (desactivada por seguridad)
spring.h2.console.enabled=false

# Métricas y health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Swagger desactivado en producción
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Matching configuration (ajustada para producción)
proposal.matching.max-active-proposals=5
proposal.matching.proposal-cooldown-minutes=20
proposal.matching.retry-delay-minutes=30
proposal.matching.max-proposals-per-entity=5
proposal.matching.max-radius-distance=10000
proposal.matching.max-distance-score=30
proposal.matching.max-weight-distance=0.5
proposal.matching.max-weight-skills=0.35
proposal.matching.max-weight-rating=0.10
proposal.matching.max-weight-load=0.05
proposal.matching.max-candidates-multiplier=6
proposal.matching.radius-expansion-step=10000
proposal.matching.max-expanded-radius=50000