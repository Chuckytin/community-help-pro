spring.application.name=community-help-api

# Perfil activo
spring.profiles.active=dev
#spring.profiles.active=prod

# Database (from environment - se usan en todos los perfiles)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.expired-in=${JWT_EXPIRED_IN}

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Email/Password Admin
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# OPENROUTE
openroute.api.base-url=https://api.openrouteservice.org
openroute.api.path-url=/v2/directions/%s?api_key=%s&start=%f,%f&end=%f,%f
openroute.api.key=${OPENROUTE_API_KEY}