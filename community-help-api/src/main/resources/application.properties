spring.application.name=community-help-api
app.version=v@project.version@

# Perfil activo
#spring.profiles.active=dev
#spring.profiles.active=prod

# Database
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.encoding=UTF-8
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.expired-in=${JWT_EXPIRED_IN}

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Email/Password Admin
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# OPENROUTE
openroute.api.base-url=https://api.openrouteservice.org
openroute.api.path-url=/v2/directions/%s?api_key=%s&start=%f,%f&end=%f,%f
openroute.api.key=${OPENROUTE_API_KEY}

# Mail brevo.com
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${MAIL_FROM}

# GOOGLE OAUTH2
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# URL a la que el backend redirige tras OAuth2 exitoso con el JWT
url.frontend.oauth2-success=${URL_FRONTEND_OAUTH2_SUCCESS:http://localhost:5173/oauth2/callback}

# App URLs
url.frontend=${URL_FRONTEND:http://localhost:5173}
url.frontend.login=${URL_FRONTEND_LOGIN:http://localhost:5173/login}

# OTP
otp.expiration-minutes=15