spring.application.name=community-help-api
app.version=v@project.version@

# Perfil activo
#spring.profiles.active=dev
#spring.profiles.active=prod

# Database
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.encoding=UTF-8
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.expired-in=${JWT_EXPIRED_IN}

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Email/Password Admin
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# OPENROUTE
openroute.api.base-url=https://api.openrouteservice.org
openroute.api.path-url=/v2/directions/%s?api_key=%s&start=%f,%f&end=%f,%f
openroute.api.key=${OPENROUTE_API_KEY}

# Mail brevo.com
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${MAIL_FROM}

# App URLs
app.frontend.url=${URL_FRONTEND}
app.frontend.url.login=${URL_FRONTEND_LOGIN}

# OTP
otp.expiration-minutes=15