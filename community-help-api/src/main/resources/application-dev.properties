spring.config.import=optional:file:../.env[.properties]

# Database (from environment - se usan en todos los perfiles)
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging detallado de base de datos
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=TRACE

# Si se necesita iniciar la base de datos con tablas existentes, se puede usar baseline para no borrar nada. Solo usar en dev o si se tiene una base de datos ya creada.
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=0

# Permite migraciones fuera de orden para facilitar el desarrollo, pero no recomendado para producción.
spring.flyway.out-of-order=false

# H2 console
spring.h2.console.enabled=true

# Matching runner (activar solo cuando se necesite regenerar proposals)
matching.run-on-startup=false

# Swagger activo en dev
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Matching configuration
proposal.matching.max-active-proposals=5
proposal.matching.proposal-cooldown-minutes=15
proposal.matching.retry-delay-minutes=2
proposal.matching.max-proposals-per-entity=5
proposal.matching.max-radius-distance=5000
proposal.matching.max-distance-score=30
proposal.matching.max-weight-distance=0.5
proposal.matching.max-weight-skills=0.35
proposal.matching.max-weight-rating=0.10
proposal.matching.max-weight-load=0.05
proposal.matching.max-candidates-multiplier=4
proposal.matching.radius-expansion-step=5000
proposal.matching.max-expanded-radius=30000

# Retry cada 2 minutos
proposal.retry-delay.interval-ms=120000

# Digest cada 5 minutos
notification.digest.interval-ms=300000

# Retiene notificaciones enviadas 7 días antes de limpiar
notification.cleanup.retention-days=7