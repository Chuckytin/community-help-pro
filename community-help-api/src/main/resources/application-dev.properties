spring.config.import=optional:file:./.env[.properties]

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true

# Swagger activo en dev
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Matching configuration
proposal.matching.max-active-proposals=3
proposal.matching.proposal-cooldown-minutes=15
proposal.matching.retry-delay-minutes=10
proposal.matching.max-proposals-per-entity=3
proposal.matching.max-radius-distance=5000
proposal.matching.max-distance-score=30
proposal.matching.max-weight-distance=0.5
proposal.matching.max-weight-skills=0.35
proposal.matching.max-weight-rating=0.10
proposal.matching.max-weight-load=0.05
proposal.matching.max-candidates-multiplier=4
proposal.matching.radius-expansion-step=5000
proposal.matching.max-expanded-radius=30000

# Notificaciones digest
notification.digest.interval-ms=300000