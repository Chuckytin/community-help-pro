spring:
  application:
    name: community-help-api

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    encoding: UTF-8
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_SECRET}
            scope: email,profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          from: ${MAIL_FROM}
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}
  expired-in: ${JWT_EXPIRED_IN}

openroute:
  api:
    base-url: https://api.openrouteservice.org
    path-url: /v2/directions/%s?api_key=%s&start=%f,%f&end=%f,%f
    key: ${OPENROUTE_API_KEY}

url:
  frontend:
    base: ${URL_FRONTEND:http://localhost:5173}
    login: ${URL_FRONTEND_LOGIN:http://localhost:5173/login}
    oauth2-success: ${URL_FRONTEND_OAUTH2_SUCCESS:http://localhost:5173/oauth2/callback}

otp:
  expiration-minutes: 15

app:
  version: v@project.version@
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%thread] %logger{36} - %msg%n"